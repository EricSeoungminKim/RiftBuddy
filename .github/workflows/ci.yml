name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          RIFTBUDDY_REQUIRE_ENV: "0"
          LLM_PROVIDER: mock
          RIFTBUDDY_TEST_MODE: "1"
        run: python -m pytest backend/tests/ -v --ignore=backend/tests/test_voice.py
